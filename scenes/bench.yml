# Bench scene: the over-the-air geometry, on one laptop, with no radio.
#
#   $NTN_PY tools/build_scene.py scenes/bench.yml --plot
#
# Compiles to data/traj_bench. Every path below becomes one more R_p(t) column
# in traj.csv, which the unmodified C++ channel block plays.
#
# The rule every path obeys: delay is the only thing injected, and Doppler
# falls out of the carrier phase. So a target that should show a Doppler is
# given an excess path that CHANGES at the rate implying it. There is no
# Doppler parameter anywhere in this file.

name: bench
out_dir: data/traj_bench
carrier_hz: 2.478e9

duration_s: 600
# 1 kHz, not the 100 Hz gen_trajectory writes. A satellite pass is smooth over
# seconds and 100 Hz interpolates perfectly; a 7 rev/s rotation is 14 samples
# per cycle, and while the spline's amplitude is fine its harmonic structure is
# not. Measured, a 100 Hz table reported a confident 4.00 rev/s against a true
# 7.00 - the comb being measured was the interpolator's, not the target's.
rate_hz: 1000

orbit:
  source: circular        # 'file' to reuse an SGP4 pass from gen_trajectory.m
  alt_km: 550
  max_elev_deg: 67.5

paths:
  - type: direct
    name: satellite

  # The emulated clutter and drone live in scenes/bench_both.yml, not here.
  #
  # They are not omitted to keep this simple. At t = 300 s the drone is a
  # couple of delay cells from the direct path with about 20 Hz of residual
  # Doppler, which is the same cell and the same band the rotating object
  # occupies, so with them present the micro-Doppler comb is a mixture.
  # Measured: 3.00 rev/s reported against a true 7.00, with the Doppler edge
  # still correct - which is what a contaminated comb looks like, and it does
  # not look like a failure.
  #
  # Both targets in one capture is the demonstration. A measurement of either
  # one has to exclude the other.

  # The physical object between the two radios. 0.4 m of excess path is
  # 0.006 of a 66.6 m delay cell, so it is NOT resolvable in delay and never
  # will be - Doppler is the only observable. 7 rev/s is chosen because its
  # harmonics miss the 25 Hz aperture comb; 5 would put every one of them on a
  # masked bin, and build_scene warns if you try.
  - type: rotating
    name: blade
    excess_m: 0.4
    radius_m: 0.25
    rot_hz: 7
    gain_db: -30

# 3GPP TR 38.811 multipath. Off by default: its clusters are statistical and
# have no ground truth, so they make a COMMUNICATION measurement credible while
# contaminating a sensing one. Turn it on to show the link survives a
# standards-defined NTN channel; score sensing with it off.
#
#  - type: ntn_tdl
#    profile: NTN-TDL-C          # -A, -B NLOS; -C, -D LOS
#    delay_spread_ns: 100
#    mobile_speed_mps: 0.83      # 3 km/h -> 6.9 Hz of Doppler spread
#    sub_rays: 1                 # >1 gives fading, and costs real-time margin
#    t_ref_s: 300

noise:
  esn0_db: 45
